<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>CryptoPulse Dashboard</title>
  </head>
  <body class="bg-gray-200">
    <header class="flex justify-evenly bg-slate-600 pt-2">
      <h1 class="text-gray-100 font-bold text-3xl mt-3">
        CryptoPulse <span class="text-teal-300">Dashboard</span>
      </h1>

      <div class="flex">
        <form>
          <label class="text-teal-300 font-bold mr-3"
            >Encuentra tu CriptoMoneda</label
          >
          <input
            id="search"
            class="bg-gray-100 mt-2 rounded-lg p-3 border-3 border-teal-300 shadow-md shadow-teal-300/50"
            type="text"
            placeholder="Termino de Busqueda "
          />
        </form>

        <div class="group relative inline-block flex justify-end p-4">
          <a id="star" href="#">
            <svg
              fill="#f9f91a"
              width="40px"
              height="40px"
              viewBox="0 0 32 32"
              version="1.1"
              xmlns="http://www.w3.org/2000/svg"
              stroke="#f9f91a"
            >
              <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
              <g
                id="SVGRepo_tracerCarrier"
                stroke-linecap="round"
                stroke-linejoin="round"
              ></g>
              <g id="SVGRepo_iconCarrier">
                <title>Favorites</title>
                <path
                  d="M3.488 13.184l6.272 6.112-1.472 8.608 7.712-4.064 7.712 4.064-1.472-8.608 6.272-6.112-8.64-1.248-3.872-7.808-3.872 7.808z"
                ></path>
              </g>
            </svg>
          </a>

          <div
            id="favorites-menu"
            class="hidden absolute right-0 mt-2 w-auto bg-white border border-gray-200 rounded-lg shadow-xl p-4 z-50"
          >
            <table
              id="favorite-list"
              class="w-full text-left text-sm text-gray-600 mb-4"
            >
              <thead class="border-b border-gray-200 text-gray-700 text-xs">
                <tr class="text-base">
                  <th class="py-3 px-6">Logo</th>
                  <th class="py-3 px-6">Nombre</th>
                  <th class="py-3 px-6">Precio (USD)</th>
                  <th class="py-3 px-6"></th>
                </tr>
              </thead>
              <tbody id="favorites" class="text-center"></tbody>
            </table>

            <a
              href="#"
              id="empty-list"
              class="eliminate block w-full text-center bg-red-500 hover:bg-red-600 text-white font-semibold py-2 px-4 rounded transition-colors duration-200 text-sm"
            >
              Eliminar todo
            </a>
          </div>
        </div>
      </div>
    </header>

    <main
      class="flex justify-evenly m-10 py-10 rounded-2xl principal-content bg-slate-600"
    >
      <div>
        <table class="bg-white rounded-xl">
          <caption class="text-gray-100 text-3xl font-bold py-3">
            Top 20 CyptoMonedas del Mercado
          </caption>
          <thead>
            <tr>
              <th class="py-3 px-6">Logo</th>
              <th class="py-3 px-6">Nombre</th>
              <th class="py-3 px-6">Precio (USD)</th>
              <th class="py-3 px-6">Variacion</th>
              <th class="py-3 px-6"></th>
            </tr>
          </thead>
          <tbody id="table-coins" class="text-center"></tbody>
        </table>
      </div>

      <div class="flex flex-col items-center mt-3">
        <h2 class="text-gray-100 text-3xl font-bold mb-6">
          Simulador de Portafolio
        </h2>

        <select
          id="select-criptos"
          class="py-3 px-5 w-full bg-gray-100 rounded-lg"
        >
          <option value="" disabled selected>Selecciona una opcion</option>
        </select>

        <div class="text-center mt-13">
          <h3 class="text-gray-100 text-xl font-bold">
            Detalles de <span id="filtration-name"></span>
          </h3>

          <div id="simulator-container"></div>
        </div>
      </div>
    </main>

    <script src="js/app.js" type="module"></script>
  </body>
</html>
